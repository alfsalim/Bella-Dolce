services:
  bella-dolce2:
    container_name: bella-dolce2
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: file:/app/data/dev.db
      # Image includes self-signed certs; use plain HTTP on localhost (see server.ts BELLA_HTTP_ONLY)
      BELLA_HTTP_ONLY: "1"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-bella-dolce-secret-change-in-production}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
