services:
  bella-dolce2:
    container_name: bella-dolce2
    build: .
    # ADD THIS COMMAND TO RUN MIGRATIONS THEN START APP
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    ports:
      - "3500:3500"
    environment:
      - PORT=3500
      - DATABASE_URL=file:/app/prisma_data/dev.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-bella-dolce-secret-change-in-production}
    volumes:
      - ./prisma_data:/app/prisma_data
    restart: always